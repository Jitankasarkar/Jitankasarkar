name: Update GitHub Dashboard

on:
  push:
    branches:
      - main

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_github_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-dashboard.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: update GitHub dashboard"
            git push
          fi
